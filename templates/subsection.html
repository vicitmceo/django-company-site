{% extends "base.html" %}
{% block title %}{{ page.title }}{% endblock %}
{% block content %}
  <div class="crumbs"><a href="{% url 'home' %}">Головна</a> / <a href="{% url section %}">{{ section_title }}</a> / {{ page.title }}</div>
  <h1>{{ page.title }}</h1>
  <div class="grid" style="margin-top:24px">
    {% for line in page.lines %}<div class="card"><p>{{ line }}</p></div>{% endfor %}
  </div>
  <div class="pills">
    {% for key, title in siblings %}<a href="/{{ section }}/{{ key }}/">{{ title }}</a>{% endfor %}
  </div>
{% endblock %}
