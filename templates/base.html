{% load static %}<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Компанія «Обрій» — розробка сайтів, мобільних застосунків та ШІ-рішень.">
  <title>{% block title %}Головна{% endblock %} — Обрій</title>
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="bar">
      <a class="logo" href="{% url 'home' %}"><img src="{% static 'img/favicon.svg' %}" alt="">Об<span>рій</span></a>
      <nav class="nav" aria-label="Головне меню">
        <a href="{% url 'services:index' %}" {% if active == 'services' %}class="active" aria-current="page"{% endif %}>Послуги</a>
        <a href="{% url 'news' %}" {% if active == 'news' %}class="active" aria-current="page"{% endif %}>Новини</a>
        <a href="{% url 'management' %}" {% if active == 'management' %}class="active" aria-current="page"{% endif %}>Керівництво</a>
        <a href="{% url 'about' %}" {% if active == 'about' %}class="active" aria-current="page"{% endif %}>Про компанію</a>
        <a href="{% url 'gallery' %}" {% if active == 'gallery' %}class="active" aria-current="page"{% endif %}>Галерея</a>
        <a href="{% url 'contacts' %}" {% if active == 'contacts' %}class="active" aria-current="page"{% endif %}>Контакти</a>
      </nav>
      <form class="site-search" action="{% url 'search' %}" method="get" role="search">
        <input type="search" name="q" value="{{ query|default:'' }}" placeholder="Пошук по сайту" aria-label="Пошук по сайту" maxlength="100">
        <button type="submit" aria-label="Шукати">🔍</button>
      </form>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <div class="bar">
      <div>© 2026 Компанія «Обрій». Навчальний вебдодаток на Django.</div>
      <div>
        <a href="{% url 'services:index' %}">Послуги</a>
        <a href="{% url 'about' %}">Про нас</a>
        <a href="{% url 'contacts' %}">Контакти</a>
      </div>
    </div>
  </footer>
</body>
</html>
